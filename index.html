```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거래처별 단가 조회</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f3f5f8;
  color: #222;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 24px;
}

header {
  margin-bottom: 24px;
}

h1 {
  margin: 0 0 8px;
  font-size: 28px;
}

.subtitle {
  color: #777;
  font-size: 14px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.panel-title {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 14px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

input:focus, select:focus {
  outline: none;
  border-color: #2563eb;
}

.search-row {
  display: flex;
  gap: 10px;
}

.search-row input {
  flex: 1;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  background: #2563eb;
  color: white;
}

button:hover {
  background: #1d4ed8;
}

.status {
  font-size: 13px;
  color: #777;
  margin-top: 10px;
}

.result-count {
  font-weight: bold;
  margin-bottom: 12px;
}

.results {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.product-card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  transition: 0.15s;
}

.product-card:hover {
  border-color: #2563eb;
  box-shadow: 0 3px 10px rgba(37,99,235,0.08);
}

.product-category {
  display: inline-block;
  background: #eff6ff;
  color: #2563eb;
  font-size: 12px;
  font-weight: bold;
  padding: 5px 8px;
  border-radius: 5px;
  margin-bottom: 8px;
}

.product-name {
  font-size: 16px;
  font-weight: bold;
  line-height: 1.5;
  margin-bottom: 8px;
}

.product-info {
  font-size: 13px;
  color: #777;
  line-height: 1.7;
}

.price-area {
  border-top: 1px solid #eee;
  margin-top: 12px;
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.retail-price {
  color: #777;
  font-size: 13px;
}

.customer-price {
  font-size: 21px;
  font-weight: bold;
  color: #2563eb;
}

.detail-panel {
  display: none;
  border: 2px solid #2563eb;
}

.detail-name {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 16px;
}

.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.detail-item {
  background: #f8fafc;
  padding: 14px;
  border-radius: 8px;
}

.detail-label {
  font-size: 12px;
  color: #777;
  margin-bottom: 6px;
}

.detail-value {
  font-size: 17px;
  font-weight: bold;
}

.final-price {
  color: #2563eb;
  font-size: 28px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 35px 10px;
  background: white;
  border-radius: 10px;
  grid-column: 1 / -1;
}

.login-overlay {
  position: fixed;
  inset: 0;
  background: #f3f5f8;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 360px;
  background: white;
  padding: 28px;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  text-align: center;
}

.login-box h2 {
  margin-top: 0;
}

.login-box input {
  margin: 14px 0;
  text-align: center;
}

.login-box button {
  width: 100%;
}

.login-error {
  color: #dc2626;
  font-size: 13px;
  margin-top: 10px;
}

@media (max-width: 600px) {
  .container {
    padding: 14px;
  }

  h1 {
    font-size: 22px;
  }

  .panel {
    padding: 16px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    width: 100%;
  }

  .results {
    grid-template-columns: 1fr;
  }

  .product-name {
    font-size: 15px;
  }

  .customer-price {
    font-size: 20px;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>직원용 단가 조회</h2>
    <p class="subtitle">비밀번호를 입력해주세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호">
    <button onclick="login()">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="container">

  <header>
    <h1>거래처별 단가 조회</h1>
    <div class="subtitle">거래처를 선택하고 상품의 적용 단가를 확인하세요.</div>
  </header>

  <div class="panel">
    <div class="panel-title">1. 거래처 선택</div>
    <select id="customerSelect" onchange="onCustomerChange()">
      <option value="">거래처를 선택해주세요.</option>
    </select>
    <div class="status" id="customerStatus">거래처 정보를 불러오는 중입니다.</div>
  </div>

  <div class="panel">
    <div class="panel-title">2. 상품 검색</div>
    <div class="search-row">
      <input
        type="text"
        id="searchInput"
        placeholder="상품명, 바코드, 상품분류 검색"
        oninput="searchProducts()"
      >
      <button onclick="searchProducts()">검색</button>
    </div>
    <div class="status" id="productStatus">상품 정보를 불러오는 중입니다.</div>
  </div>

  <div class="panel detail-panel" id="detailPanel">
    <div class="panel-title">선택한 상품</div>
    <div class="detail-name" id="detailName"></div>
    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-label">상품분류</div>
        <div class="detail-value" id="detailCategory"></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">규격</div>
        <div class="detail-value" id="detailSpec"></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">소매가</div>
        <div class="detail-value" id="detailRetail"></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">거래처 단가율</div>
        <div class="detail-value" id="detailRate"></div>
      </div>
      <div class="detail-item" style="grid-column:1 / -1;">
        <div class="detail-label">적용 단가</div>
        <div class="detail-value final-price" id="detailPrice"></div>
      </div>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="results" id="results">
    <div class="empty">거래처와 상품을 선택해주세요.</div>
  </div>

</div>

<script>
/* =========================
   Google Sheets 설정
========================= */

const SHEET_ID = "19WlE1Iou4tsuqdb5qACWUheZeX3-F1ccNKs4_IucepQ";

const PRODUCT_SHEET_NAME = "상품리스트";
const CUSTOMER_SHEET_NAME = "거래처별 단가";

/* 직원용 비밀번호 */
const PASSWORD = "2221";

/* =========================
   데이터 변수
========================= */

let products = [];
let customers = [];
let selectedCustomer = "";

let productsLoaded = false;
let customersLoaded = false;

/* =========================
   로그인
========================= */

function login() {
  const password = document.getElementById("passwordInput").value;

  if (password === PASSWORD) {
    document.getElementById("loginOverlay").style.display = "none";
  } else {
    document.getElementById("loginError").textContent =
      "비밀번호가 올바르지 않습니다.";
  }
}

document.getElementById("passwordInput")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      login();
    }
  });

/* =========================
   Google Sheets JSONP
========================= */

function loadSheet(sheetName, callbackName) {
  const url =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?sheet=" +
    encodeURIComponent(sheetName) +
    "&tqx=out:json";

  window.google = window.google || {};
  window.google.visualization = window.google.visualization || {};
  window.google.visualization.Query =
    window.google.visualization.Query || {};

  window.google.visualization.Query.setResponse = function(response) {
    if (response.status === "error") {
      console.error("시트 오류:", sheetName, response);
      document.getElementById(callbackName).textContent =
        sheetName + " 데이터를 불러오지 못했습니다.";
      return;
    }

    const table = response.table;
    const headers = table.cols.map(col => col.label.trim());

    const rows = table.rows.map(row => {
      const obj = {};

      headers.forEach((header, index) => {
        const cell = row.c[index];
        obj[header] = cell ? cell.v : "";
      });

      return obj;
    });

    if (sheetName === PRODUCT_SHEET_NAME) {
      products = rows;
      productsLoaded = true;

      document.getElementById("productStatus").textContent =
        "상품 " + products.length.toLocaleString() + "개 불러오기 완료";
    }

    if (sheetName === CUSTOMER_SHEET_NAME) {
      customers = rows;
      customersLoaded = true;

      renderCustomers();

      document.getElementById("customerStatus").textContent =
        "거래처 " + customers.length.toLocaleString() + "개 불러오기 완료";
    }

    searchProducts();
  };

  const script = document.createElement("script");
  script.src = url;
  script.onerror = function() {
    document.getElementById(callbackName).textContent =
      sheetName + " 데이터를 불러오지 못했습니다. 시트 공유 설정을 확인해주세요.";
  };

  document.body.appendChild(script);
}

/* =========================
   데이터 초기화
========================= */

window.addEventListener("load", function() {
  loadSheet(PRODUCT_SHEET_NAME, "productStatus");
  loadSheet(CUSTOMER_SHEET_NAME, "customerStatus");
});

/* =========================
   거래처 목록 표시
========================= */

function renderCustomers() {
  const select = document.getElementById("customerSelect");

  select.innerHTML =
    '<option value="">거래처를 선택해주세요.</option>';

  customers.forEach(customer => {
    const name = String(customer["상품분류"] || "").trim();

    if (!name) return;

    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;

    select.appendChild(option);
  });
}

/* =========================
   거래처 선택
========================= */

function onCustomerChange() {
  selectedCustomer = document.getElementById("customerSelect").value;

  document.getElementById("detailPanel").style.display = "none";

  searchProducts();
}

/* =========================
   숫자 변환 및 금액 표시
========================= */

function toNumber(value) {
  if (value === null || value === undefined || value === "") {
    return NaN;
  }

  const cleaned = String(value)
    .replace(/,/g, "")
    .replace(/%/g, "")
    .trim();

  return Number(cleaned);
}

function formatNumber(value) {
  if (!Number.isFinite(value)) {
    return "-";
  }

  return Math.round(value).toLocaleString("ko-KR") + "원";
}

/* =========================
   거래처 단가율 조회
========================= */

function getCustomerRate(customerName, makerName) {
  if (!customerName || !makerName) {
    return NaN;
  }

  const customer = customers.find(row =>
    String(row["상품분류"] || "").trim() === customerName
  );

  if (!customer) {
    return NaN;
  }

  const maker = String(makerName).trim();

  const rate = customer[maker];

  return toNumber(rate);
}

/* =========================
   적용 단가 계산
   소매가 × 단가율 ÷ 100
========================= */

function calculatePrice(retailPrice, rate) {
  const retail = toNumber(retailPrice);

  if (!Number.isFinite(retail) || !Number.isFinite(rate)) {
    return NaN;
  }

  return retail * rate / 100;
}

/* =========================
   상품 검색
========================= */

function searchProducts() {
  const keyword = document.getElementById("searchInput")
    .value.trim().toLowerCase();

  const resultsElement = document.getElementById("results");
  const countElement = document.getElementById("resultCount");

  if (!productsLoaded || !customersLoaded) {
    resultsElement.innerHTML =
      '<div class="empty">데이터를 불러오는 중입니다.</div>';
    return;
  }

  if (!selectedCustomer) {
    resultsElement.innerHTML =
      '<div class="empty">먼저 거래처를 선택해주세요.</div>';

    countElement.textContent = "";
    return;
  }

  let filtered = products.filter(product => {
    const barcode = String(product["바코드"] || "").toLowerCase();
    const category = String(product["상품분류"] || "").toLowerCase();
    const name = String(product["상품명"] || "").toLowerCase();

    return (
      barcode.includes(keyword) ||
      category.includes(keyword) ||
      name.includes(keyword)
    );
  });

  /* 바코드 완전 일치 우선 */
  if (keyword) {
    const exactBarcode = filtered.filter(product =>
      String(product["바코드"] || "").toLowerCase() === keyword
    );

    if (exactBarcode.length > 0) {
      filtered = exactBarcode;
    }
  }

  countElement.textContent =
    "검색 결과 " + filtered.length.toLocaleString() + "개";

  if (filtered.length === 0) {
    resultsElement.innerHTML =
      '<div class="empty">검색 결과가 없습니다.</div>';
    return;
  }

  resultsElement.innerHTML = "";

  filtered.forEach(product => {
    const category = product["상품분류"] || "-";
    const barcode = product["바코드"] || "-";
    const name = product["상품명"] || "-";
    const spec = product["규격"] || "-";
    const retail = toNumber(product["소매가"]);

    /* 메이커는 내부 계산에만 사용 */
    const maker = product["메이커"] || "";

    const rate = getCustomerRate(selectedCustomer, maker);
    const price = calculatePrice(retail, rate);

    const card = document.createElement("div");
    card.className = "product-card";

    const categoryElement = document.createElement("div");
    categoryElement.className = "product-category";
    categoryElement.textContent = category;

    const nameElement = document.createElement("div");
    nameElement.className = "product-name";
    nameElement.textContent = name;

    const infoElement = document.createElement("div");
    infoElement.className = "product-info";
    infoElement.textContent =
      "바코드: " + barcode + "\n" +
      "규격: " + spec;

    infoElement.style.whiteSpace = "pre-line";

    const priceArea = document.createElement("div");
    priceArea.className = "price-area";

    const retailElement = document.createElement("div");
    retailElement.className = "retail-price";
    retailElement.textContent =
      "소매가 " + formatNumber(retail);

    const customerPriceElement = document.createElement("div");
    customerPriceElement.className = "customer-price";
    customerPriceElement.textContent = formatNumber(price);

    priceArea.appendChild(retailElement);
    priceArea.appendChild(customerPriceElement);

    card.appendChild(categoryElement);
    card.appendChild(nameElement);
    card.appendChild(infoElement);
    card.appendChild(priceArea);

    card.addEventListener("click", function() {
      showProductDetail(product);
    });

    resultsElement.appendChild(card);
  });
}

/* =========================
   상품 상세 표시
========================= */

function showProductDetail(product) {
  const maker = product["메이커"] || "";

  const retail = toNumber(product["소매가"]);
  const rate = getCustomerRate(selectedCustomer, maker);
  const price = calculatePrice(retail, rate);

  document.getElementById("detailName").textContent =
    product["상품명"] || "-";

  document.getElementById("detailCategory").textContent =
    product["상품분류"] || "-";

  document.getElementById("detailSpec").textContent =
    product["규격"] || "-";

  document.getElementById("detailRetail").textContent =
    formatNumber(retail);

  document.getElementById("detailRate").textContent =
    Number.isFinite(rate) ? rate + "%" : "단가율 없음";

  document.getElementById("detailPrice").textContent =
    formatNumber(price);

  document.getElementById("detailPanel").style.display = "block";

  document.getElementById("detailPanel").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
</script>

</body>
</html>
