<!DOCTYPE html>

<body>

  <div class="container">

    <div class="subtitle">
      거래처별 상품 판매 단가를 확인할 수 있습니다.

    <!-- 검색 영역 -->
    <section class="panel">

      <div class="form-row">
        <div class="field">
          <label for="customerSelect">거래처 선택</label>
          <select id="customerSelect">
            <option value="">거래처를 선택해 주세요.</option>

      <div class="form-row">
        <div class="field">
          <label for="searchInput">상품명 또는 바코드 검색</label>

            type="text"
            id="searchInput"
            placeholder="상품명 또는 바코드를 입력하세요."
          >

          class="search-button"
          id="searchButton"
          type="button"
        >
          검색
        </button>

        데이터를 불러오는 중입니다.
      </div>

      <div class="result-header">

            class="refresh-button"
            id="refreshButton"
            type="button"
          >
            새로고침
          </button>

      <div class="table-wrapper">
        <div class="result-scroll" id="resultScroll">
          <table>
            <thead>
              <tr>
                <th>바코드</th>
                <th>상품명</th>
                <th>규격</th>
                <th>소매가</th>
                <th>적용 단가율</th>
                <th>거래처 단가</th>
              </tr>
            </thead>

            <tbody id="resultBody">
              <tr>
                <td colspan="6" class="empty">
                  거래처와 상품을 검색해 주세요.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>

  </div>

<script>
/* =========================================
   1. 기본 설정
========================================= */

const SPREADSHEET_ID =
  "19WlE1Iou4tsuqdb5qACWUheZeX3-F1ccNKs4_IucepQ";

const PRODUCT_GID = "1714186521";
const CUSTOMER_GID = "100929157";

const LOGIN_PASSWORD = "2221";
const AUTO_REFRESH_MS = 60000;

let products = [];
let customers = [];
let makerHeaders = [];

let productLoaded = false;
let customerLoaded = false;
let lastRefreshTime = null;


/* =========================================
   2. 공통 함수
========================================= */

function normalizeText(value) {
  return String(value ?? "")
    .normalize("NFKC")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");
}

function normalizeBarcode(value) {
  let barcode = String(value ?? "")
    .trim()
    .replace(/\.0$/, "")
    .replace(/[^0-9]/g, "");

  barcode = barcode.replace(/^0+/, "");

  return barcode || "0";
}

function getCellValue(row, index) {
  const cell = row?.c?.[index];

  if (!cell || cell.v === null || cell.v === undefined) {
    return "";
  }

  return cell.v;
}

function getCellFormattedValue(row, index) {
  const cell = row?.c?.[index];

  if (!cell) return "";

  if (cell.f !== undefined && cell.f !== null) {
    return String(cell.f);
  }

  return String(cell.v ?? "");
}

function formatNumber(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) {
    return "-";
  }

  return Math.floor(number).toLocaleString("ko-KR");
}

function formatRate(rate) {
  if (!Number.isFinite(rate)) return "-";

  const percent = rate * 100;

  return Number.isInteger(percent)
    ? percent.toLocaleString("ko-KR") + "%"
    : percent.toLocaleString("ko-KR", {
        maximumFractionDigits: 2
      }) + "%";
}


/* =========================================
   3. 단가율 변환
========================================= */

function parseRate(value) {
  if (value === null || value === undefined || value === "") {
    return null;
  }

  let text = String(value).trim();

  if (!text) return null;

  const hasPercent = text.includes("%");

  text = text
    .replace(/,/g, "")
    .replace(/%/g, "")
    .trim();

  const number = Number(text);

  if (!Number.isFinite(number) || number < 0) {
    return null;
  }

  if (hasPercent) {
    return number / 100;
  }

  // 54 또는 49.5처럼 입력된 값은 퍼센트로 처리
  // 0.54 또는 0.495처럼 입력된 값은 이미 비율로 처리
  if (number > 1) {
    return number / 100;
  }

  return number;
}


/* =========================================
   4. Google 스프레드시트 데이터 불러오기
========================================= */

function loadSheet(gid) {
  return new Promise((resolve, reject) => {

    const callbackName =
      "sheetCallback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    const baseUrl =
      "https://docs.google.com/spreadsheets/d/" +
      SPREADSHEET_ID +
      "/gviz/tq";

    const params = new URLSearchParams({
      gid: gid,
      headers: "1",
      tqx: "out:json;responseHandler:" + callbackName
    });

    let finished = false;

    const timeout = setTimeout(() => {
      finish(
        new Error("시트 응답 시간이 초과되었습니다.")
      );
    }, 25000);

    function finish(error, result) {
      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      delete window[callbackName];

      script.remove();

      if (error) {
        reject(error);
      } else {
        resolve(result);
      }
    }

    window[callbackName] = function(response) {

      if (!response) {
        finish(new Error("시트 응답이 비어 있습니다."));
        return;
      }

      if (
        response.status &&
        String(response.status).toLowerCase() !== "ok"
      ) {
        const message =
          response.errors?.[0]?.detailed_message ||
          response.errors?.[0]?.reason ||
          "시트 데이터를 읽지 못했습니다.";

        finish(new Error(message));
        return;
      }

      if (!response.table) {
        finish(new Error("시트 표 데이터를 찾을 수 없습니다."));
        return;
      }

      finish(null, response.table);
    };

    script.onerror = function() {
      finish(
        new Error(
          "스프레드시트 연결에 실패했습니다. 공유 권한을 확인해 주세요."
        )
      );
    };

    script.src = baseUrl + "?" + params.toString();

    document.head.appendChild(script);
  });
}


/* =========================================
   5. 상품 목록 처리
========================================= */

function parseProducts(table) {

  const rows = table.rows || [];

  const result = [];

  rows.forEach(row => {

    const barcode = String(
      getCellValue(row, 0)
    ).trim();

    const category = String(
      getCellValue(row, 1)
    ).trim();

    const maker = String(
      getCellValue(row, 2)
    ).trim();

    const name = String(
      getCellValue(row, 3)
    ).trim();

    const spec = String(
      getCellValue(row, 4)
    ).trim();

    const retailRaw = getCellValue(row, 5);

    const retailPrice = Number(
      String(retailRaw)
        .replace(/,/g, "")
        .replace(/원/g, "")
        .trim()
    );

    if (!name) return;

    result.push({
      barcode,
      category,
      maker,
      name,
      spec,
      retailPrice: Number.isFinite(retailPrice)
        ? retailPrice
        : null
    });
  });

  return result;
}


/* =========================================
   6. 거래처별 단가표 처리
========================================= */

function parseCustomers(table) {

  const rows = table.rows || [];
  const cols = table.cols || [];

  /*
    표 구조

    A열 : 거래처명
    B열부터 : 메이커명

    A1 : 상품분류 또는 거래처명 제목
    B1 : 3M
    C1 : 짐모아_제브라
    ...

    A2 : 모던
    A3 : 모닝
    ...

    따라서 rows[0]부터 읽어야 함.
    rows[0]은 실제 시트의 2행(A2)임.
  */

  makerHeaders = cols
    .slice(1)
    .map(col => String(col.label || col.id || "").trim());

  const result = [];

  rows.forEach(row => {

    const customerName = String(
      getCellValue(row, 0)
    ).trim();

    if (!customerName) return;

    const rates = {};

    makerHeaders.forEach((makerName, index) => {

      if (!makerName) return;

      const value = getCellValue(row, index + 1);

      rates[normalizeText(makerName)] = parseRate(value);
    });

    result.push({
      name: customerName,
      rates: rates
    });
  });

  return result;
}


/* =========================================
   7. 데이터 갱신
========================================= */

async function loadAllData() {

  const status = document.getElementById("status");
  const refreshButton = document.getElementById("refreshButton");

  status.className = "status";
  status.textContent = "상품 및 거래처 데이터를 불러오는 중입니다.";

  refreshButton.disabled = true;

  try {

    const [productTable, customerTable] = await Promise.all([
      loadSheet(PRODUCT_GID),
      loadSheet(CUSTOMER_GID)
    ]);

    const newProducts = parseProducts(productTable);
    const newCustomers = parseCustomers(customerTable);

    products = newProducts;
    customers = newCustomers;

    productLoaded = true;
    customerLoaded = true;

    lastRefreshTime = new Date();

    updateCustomerSelect();

    status.className = "status success";

    status.textContent =
      "상품 " + products.length.toLocaleString("ko-KR") +
      "개 / 거래처 " + customers.length.toLocaleString("ko-KR") +
      "개 데이터 불러오기 완료 · 마지막 갱신 " +
      lastRefreshTime.toLocaleTimeString("ko-KR");

    // 기존 검색어가 있으면 갱신 후 다시 검색
    if (document.getElementById("searchInput").value.trim()) {
      searchProducts();
    }

  } catch (error) {

    console.error("데이터 로딩 오류:", error);

    status.className = "status error";

    status.textContent =
      "데이터 불러오기 실패: " + error.message;

  } finally {

    refreshButton.disabled = false;
  }
}


/* =========================================
   8. 거래처 선택 목록
========================================= */

function updateCustomerSelect() {

  const select = document.getElementById("customerSelect");

  const previousValue = select.value;

  select.innerHTML =
    '<option value="">거래처를 선택해 주세요.</option>';

  customers.forEach(customer => {

    const option = document.createElement("option");

    option.value = customer.name;
    option.textContent = customer.name;

    select.appendChild(option);
  });

  if (
    previousValue &&
    customers.some(c => c.name === previousValue)
  ) {
    select.value = previousValue;
  }
}


/* =========================================
   9. 선택한 거래처 가져오기
========================================= */

function getSelectedCustomer() {

  const customerName =
    document.getElementById("customerSelect").value;

  if (!customerName) return null;

  return customers.find(
    customer => customer.name === customerName
  ) || null;
}


/* =========================================
   10. 상품 검색
========================================= */

function searchProducts() {

  const query = document
    .getElementById("searchInput")
    .value.trim();

  const customer = getSelectedCustomer();

  const resultBody =
    document.getElementById("resultBody");

  const resultCount =
    document.getElementById("resultCount");

  const resultScroll =
    document.getElementById("resultScroll");

  if (!productLoaded || !customerLoaded) {

    showEmpty("데이터를 불러오는 중입니다.");

    return;
  }

  if (!customer) {

    showEmpty("거래처를 먼저 선택해 주세요.");

    return;
  }

  if (!query) {

    showEmpty("상품명 또는 바코드를 입력해 주세요.");

    return;
  }

  const normalizedQuery = normalizeText(query);

  const numericQuery = /^\d+$/.test(query);

  const normalizedBarcodeQuery =
    numericQuery ? normalizeBarcode(query) : "";

  /*
    검색 기준

    1. 상품명: 입력한 글자가 포함되면 검색
       숫자 검색도 예외 없이 상품명 부분 일치 허용

    2. 바코드: 숫자 검색일 때 앞의 0을 제거한 뒤
       전체 바코드가 정확히 일치하는 경우만 검색

    두 조건 중 하나라도 만족하면 결과에 표시
  */

  const matchedProducts = products.filter(product => {

    const nameMatch =
      normalizeText(product.name).includes(normalizedQuery);

    const barcodeMatch =
      numericQuery &&
      normalizeBarcode(product.barcode) === normalizedBarcodeQuery;

    return nameMatch || barcodeMatch;
  });

  resultBody.innerHTML = "";

  resultCount.textContent =
    matchedProducts.length.toLocaleString("ko-KR") + "개 상품";

  resultScroll.scrollTop = 0;

  if (matchedProducts.length === 0) {

    showEmpty("검색 결과가 없습니다.");

    return;
  }

  matchedProducts.forEach(product => {

    const makerKey = normalizeText(product.maker);

    const rate = customer.rates[makerKey];

    const tr = document.createElement("tr");

    const barcodeTd = document.createElement("td");
    barcodeTd.textContent = product.barcode || "-";

    const nameTd = document.createElement("td");
    nameTd.className = "name";
    nameTd.textContent = product.name;

    const specTd = document.createElement("td");
    specTd.textContent = product.spec || "-";

    const retailTd = document.createElement("td");
    retailTd.textContent =
      product.retailPrice === null
        ? "-"
        : formatNumber(product.retailPrice) + "원";

    const rateTd = document.createElement("td");

    const priceTd = document.createElement("td");
    priceTd.className = "price";

    if (rate === null || rate === undefined) {

      rateTd.innerHTML =
        '<span class="rate-warning">확인 필요</span>';

      priceTd.innerHTML =
        '<span class="rate-warning">단가율 없음</span>';

    } else if (product.retailPrice === null) {

      rateTd.textContent = formatRate(rate);

      priceTd.textContent = "소매가 확인 필요";

    } else {

      const customerPrice =
        Math.floor(product.retailPrice * rate);

      rateTd.textContent = formatRate(rate);

      priceTd.textContent =
        formatNumber(customerPrice) + "원";
    }

    tr.appendChild(barcodeTd);
    tr.appendChild(nameTd);
    tr.appendChild(specTd);
    tr.appendChild(retailTd);
    tr.appendChild(rateTd);
    tr.appendChild(priceTd);

    resultBody.appendChild(tr);
  });
}


/* =========================================
   11. 검색 결과 안내
========================================= */

function showEmpty(message) {

  const resultBody =
    document.getElementById("resultBody");

  const resultCount =
    document.getElementById("resultCount");

  resultBody.innerHTML = "";

  const tr = document.createElement("tr");
  const td = document.createElement("td");

  td.colSpan = 6;
  td.className = "empty";
  td.textContent = message;

  tr.appendChild(td);
  resultBody.appendChild(tr);

  resultCount.textContent = "0개 상품";
}


/* =========================================
   12. 로그인
========================================= */

function login() {

  const password =
    document.getElementById("passwordInput").value;

  const error =
    document.getElementById("loginError");

  if (password === LOGIN_PASSWORD) {

    document
      .getElementById("loginOverlay")
      .classList.add("hidden");

    sessionStorage.setItem("productLogin", "true");

    loadAllData();

  } else {

    error.textContent = "비밀번호가 일치하지 않습니다.";

    document.getElementById("passwordInput").value = "";
    document.getElementById("passwordInput").focus();
  }
}


/* =========================================
   13. 이벤트 연결
========================================= */

document
  .getElementById("loginButton")
  .addEventListener("click", login);

document
  .getElementById("passwordInput")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      login();
    }
  });

document
  .getElementById("searchButton")
  .addEventListener("click", searchProducts);

document
  .getElementById("searchInput")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      searchProducts();
    }
  });

document
  .getElementById("customerSelect")
  .addEventListener("change", () => {

    if (document.getElementById("searchInput").value.trim()) {
      searchProducts();
    }
  });

document
  .getElementById("refreshButton")
  .addEventListener("click", loadAllData);


/* =========================================
   14. 자동 갱신
========================================= */

if (sessionStorage.getItem("productLogin") === "true") {

  document
    .getElementById("loginOverlay")
    .classList.add("hidden");

  loadAllData();
}

setInterval(() => {

  if (
    sessionStorage.getItem("productLogin") === "true"
  ) {
    loadAllData();
  }

}, AUTO_REFRESH_MS);

</script>

</body>
</html>
