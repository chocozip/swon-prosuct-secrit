```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직원 전용 상품 단가 조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f9;
      font-family: "Malgun Gothic", sans-serif;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5dbe3;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input {
      margin-top: 12px;
    }

    .product-list {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .product-item {
      border: 1px solid #e0e5ec;
      border-radius: 10px;
      padding: 15px;
      cursor: pointer;
      background: #fff;
      transition: 0.15s;
    }

    .product-item:hover {
      background: #f0f6ff;
      border-color: #7ba9e8;
    }

    .product-category {
      display: inline-block;
      background: #eaf2ff;
      color: #2563eb;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-info {
      font-size: 13px;
      color: #666;
      line-height: 1.7;
    }

    .price-result {
      text-align: center;
      padding: 25px 15px;
      background: #f0f6ff;
      border-radius: 10px;
      margin-top: 15px;
    }

    .price-result .category {
      font-size: 13px;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .price-result .name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .price-result .price {
      font-size: 36px;
      font-weight: bold;
      color: #1d4ed8;
    }

    .price-result .details {
      font-size: 14px;
      color: #555;
      margin-top: 12px;
      line-height: 1.8;
    }

    .message {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .error {
      color: #dc2626;
    }

    #loginScreen {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #loginScreen h2 {
      text-align: center;
    }

    #loginButton {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #loginError {
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    #mainScreen {
      display: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 21px;
      }

      .card {
        padding: 15px;
      }

      .price-result .price {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- 비밀번호 화면 -->
  <div id="loginScreen">
    <h2>직원 전용 단가 조회</h2>
    <input
      type="password"
      id="passwordInput"
      placeholder="비밀번호 입력"
      autocomplete="off"
    >
    <button id="loginButton" onclick="login()">접속하기</button>
    <div id="loginError"></div>
  </div>

  <!-- 메인 화면 -->
  <div id="mainScreen">
    <div class="container">

      <h1>직원 전용 상품 단가 조회</h1>

      <div class="card">
        <label for="customerSelect">거래처 선택</label>
        <select id="customerSelect">
          <option value="">거래처를 선택하세요</option>
        </select>
      </div>

      <div class="card">
        <label for="searchInput">상품 검색</label>
        <input
          type="text"
          id="searchInput"
          placeholder="상품명 또는 바코드 검색"
        >
        <div id="productList" class="product-list">
          <div class="message">거래처를 먼저 선택하세요.</div>
        </div>
      </div>

      <div class="card">
        <label>조회 결과</label>
        <div id="priceDisplay">
          <div class="message">상품을 선택하면 단가가 표시됩니다.</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SHEET_ID =
      "19WlE1Iou4tsuqdb5qACWUheZeX3-F1ccNKs4_Iucep";

    const PRODUCT_SHEET = "상품리스트";
    const CUSTOMER_SHEET = "거래처별 단가";

    const PASSWORD = "2221";

    let products = [];
    let customers = [];
    let customerRates = {};
    let productHeaders = [];

    // 비밀번호 확인
    function login() {
      const password =
        document.getElementById("passwordInput").value;

      if (password === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainScreen").style.display = "block";

        loadData();
      } else {
        document.getElementById("loginError").textContent =
          "비밀번호가 올바르지 않습니다.";
      }
    }

    document
      .getElementById("passwordInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          login();
        }
      });

    // Google Sheets 데이터 불러오기
    function loadSheet(sheetName) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        const timeout = setTimeout(() => {
          script.remove();
          reject(new Error(sheetName + " 데이터 로딩 시간 초과"));
        }, 15000);

        window.google = window.google || {};
        window.google.visualization =
          window.google.visualization || {};

        window.google.visualization.Query =
          window.google.visualization.Query || {};

        window.google.visualization.Query.setResponse =
          function(response) {
            clearTimeout(timeout);
            script.remove();

            if (response && response.status === "error") {
              reject(new Error("시트 데이터를 불러오지 못했습니다."));
              return;
            }

            resolve(response.table);
          };

        const url =
          "https://docs.google.com/spreadsheets/d/" +
          SHEET_ID +
          "/gviz/tq?sheet=" +
          encodeURIComponent(sheetName) +
          "&tqx=out:json";

        script.src = url;

        script.onerror = function() {
          clearTimeout(timeout);
          script.remove();
          reject(new Error(sheetName + " 시트 연결 실패"));
        };

        document.head.appendChild(script);
      });
    }

    // 셀 값 가져오기
    function getCellValue(row, index) {
      if (!row || !row.c || !row.c[index]) {
        return "";
      }

      const cell = row.c[index];

      if (cell.v === null || cell.v === undefined) {
        return "";
      }

      return cell.v;
    }

    // 헤더 정리
    function normalizeHeader(value) {
      return String(value || "")
        .trim()
        .replace(/\s+/g, " ");
    }

    // 데이터 로딩
    async function loadData() {
      const productListElement =
        document.getElementById("productList");

      productListElement.innerHTML =
        '<div class="message">상품 데이터를 불러오는 중입니다.</div>';

      try {
        // 반드시 순차적으로 로딩
        const productTable = await loadSheet(PRODUCT_SHEET);

        productHeaders = productTable.cols.map(col =>
          normalizeHeader(col.label)
        );

        products = productTable.rows.map(row => {
          const item = {};

          productHeaders.forEach((header, index) => {
            item[header] = getCellValue(row, index);
          });

          return item;
        });

        const customerTable =
          await loadSheet(CUSTOMER_SHEET);

        const customerHeaders =
          customerTable.cols.map(col =>
            normalizeHeader(col.label)
          );

        customers = [];
        customerRates = {};

        customerTable.rows.forEach(row => {
          const customerName =
            String(getCellValue(row, 0)).trim();

          if (!customerName) {
            return;
          }

          customers.push(customerName);

          const rates = {};

          // A열은 거래처명, B열부터 메이커별 단가율
          for (let i = 1; i < customerHeaders.length; i++) {
            const maker = customerHeaders[i];

            if (!maker) {
              continue;
            }

            rates[maker] = getCellValue(row, i);
          }

          customerRates[customerName] = rates;
        });

        renderCustomers();

        productListElement.innerHTML =
          '<div class="message">거래처를 선택한 후 상품을 검색하세요.</div>';

      } catch (error) {
        productListElement.innerHTML =
          '<div class="message error">' +
          error.message +
          '<br>스프레드시트 공유 설정을 확인하세요.</div>';
      }
    }

    // 거래처 목록 표시
    function renderCustomers() {
      const select =
        document.getElementById("customerSelect");

      select.innerHTML =
        '<option value="">거래처를 선택하세요</option>';

      customers.forEach(customer => {
        const option = document.createElement("option");

        option.value = customer;
        option.textContent = customer;

        select.appendChild(option);
      });
    }

    // 거래처 선택
    document
      .getElementById("customerSelect")
      .addEventListener("change", function() {
        document.getElementById("searchInput").value = "";

        document.getElementById("priceDisplay").innerHTML =
          '<div class="message">상품을 선택하면 단가가 표시됩니다.</div>';

        renderProducts();
      });

    // 상품 검색
    document
      .getElementById("searchInput")
      .addEventListener("input", renderProducts);

    // 상품 목록 표시
    function renderProducts() {
      const customer =
        document.getElementById("customerSelect").value;

      const keyword =
        document.getElementById("searchInput").value
          .trim()
          .toLowerCase();

      const list =
        document.getElementById("productList");

      if (!customer) {
        list.innerHTML =
          '<div class="message">거래처를 먼저 선택하세요.</div>';
        return;
      }

      const filtered = products.filter(item => {
        const name = String(item["상품명"] || "").toLowerCase();
        const barcode = String(item["바코드"] || "").toLowerCase();

        return name.includes(keyword) ||
               barcode.includes(keyword);
      });

      if (filtered.length === 0) {
        list.innerHTML =
          '<div class="message">검색 결과가 없습니다.</div>';
        return;
      }

      list.innerHTML = "";

      filtered.slice(0, 100).forEach(item => {
        const div = document.createElement("div");

        div.className = "product-item";

        const category =
          item["상품분류"] || "";

        const name =
          item["상품명"] || "";

        const spec =
          item["규격"] || "";

        const barcode =
          item["바코드"] || "";

        const retailPrice =
          Number(item["소매가"]) || 0;

        const categoryElement =
          document.createElement("div");

        categoryElement.className = "product-category";
        categoryElement.textContent = category;

        const nameElement =
          document.createElement("div");

        nameElement.className = "product-name";
        nameElement.textContent = name;

        const infoElement =
          document.createElement("div");

        infoElement.className = "product-info";

        infoElement.textContent =
          "규격: " + spec +
          " | 바코드: " + barcode +
          " | 소매가: " + retailPrice.toLocaleString("ko-KR") + "원";

        div.appendChild(categoryElement);
        div.appendChild(nameElement);
        div.appendChild(infoElement);

        div.addEventListener("click", function() {
          calculatePrice(item, customer);
        });

        list.appendChild(div);
      });
    }

    // 단가율 변환
    function parseRate(value) {
      if (value === null || value === undefined || value === "") {
        return null;
      }

      let rate;

      if (typeof value === "string") {
        const text = value.trim();

        if (text.endsWith("%")) {
          rate = parseFloat(text.replace("%", ""));

          if (isNaN(rate)) {
            return null;
          }

          return rate / 100;
        }

        rate = parseFloat(text);
      } else {
        rate = Number(value);
      }

      if (isNaN(rate)) {
        return null;
      }

      // 시트 값이 49.5라면 49.5%
      // 시트 값이 0.495라면 49.5%
      if (rate > 1) {
        return rate / 100;
      }

      return rate;
    }

    // 상품 단가 계산
    function calculatePrice(item, customer) {
      const maker =
        normalizeHeader(item["메이커"]);

      const retailPrice =
        Number(item["소매가"]) || 0;

      const category =
        item["상품분류"] || "";

      const name =
        item["상품명"] || "";

      const spec =
        item["규격"] || "";

      const barcode =
        item["바코드"] || "";

      const customerRate =
        customerRates[customer];

      const rateValue =
        customerRate ? customerRate[maker] : null;

      const rate = parseRate(rateValue);

      const display =
        document.getElementById("priceDisplay");

      if (!maker) {
        display.innerHTML =
          '<div class="message error">' +
          '상품의 메이커 정보가 없습니다.</div>';
        return;
      }

      if (rate === null) {
        display.innerHTML =
          '<div class="message error">' +
          customer + " 거래처의 " + maker +
          " 단가율을 찾을 수 없습니다.</div>";
        return;
      }

      // 소수점 이하 절삭: 반올림하지 않음
      const finalPrice =
        Math.floor(retailPrice * rate);

      const ratePercent =
        (rate * 100).toLocaleString("ko-KR", {
          maximumFractionDigits: 4
        });

      display.innerHTML = "";

      const result =
        document.createElement("div");

      result.className = "price-result";

      const categoryElement =
        document.createElement("div");

      categoryElement.className = "category";
      categoryElement.textContent = category;

      const nameElement =
        document.createElement("div");

      nameElement.className = "name";
      nameElement.textContent = name;

      const priceElement =
        document.createElement("div");

      priceElement.className = "price";
      priceElement.textContent =
        finalPrice.toLocaleString("ko-KR") + "원";

      const details =
        document.createElement("div");

      details.className = "details";

      details.textContent =
        "거래처: " + customer +
        "\n규격: " + spec +
        "\n바코드: " + barcode +
        "\n소매가: " + retailPrice.toLocaleString("ko-KR") + "원" +
        "\n단가율: " + ratePercent + "%" +
        "\n계산: " + retailPrice.toLocaleString("ko-KR") +
        " × " + ratePercent + "%" +
        "\n소수점 이하 절삭 적용";

      details.style.whiteSpace = "pre-line";

      result.appendChild(categoryElement);
      result.appendChild(nameElement);
      result.appendChild(priceElement);
      result.appendChild(details);

      display.appendChild(result);
    }
  </script>

</body>
</html>
