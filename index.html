
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 단가 조회</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 16px;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #f3f5f8;
  color: #222;
}

.container {
  max-width: 1050px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 8px;
  font-size: 27px;
}

.subtitle {
  color: #777;
  font-size: 13px;
  margin-bottom: 24px;
}

.panel {
  background: #fff;
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 2px 10px rgba(0,0,0,.045);
}

.form-row {
  display: flex;
  gap: 12px;
  margin-bottom: 15px;
}

.field {
  flex: 1;
  min-width: 0;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

input, select {
  width: 100%;
  height: 46px;
  padding: 0 13px;
  border: 1px solid #d9dee7;
  border-radius: 7px;
  font-size: 15px;
  background: #fff;
}

input:focus, select:focus {
  outline: none;
  border-color: #3678e5;
}

button {
  height: 46px;
  padding: 0 23px;
  border: none;
  border-radius: 7px;
  background: #2869d8;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #aab5c5;
  cursor: not-allowed;
}

.search-button {
  min-width: 110px;
  align-self: flex-end;
}

.status {
  margin-top: 13px;
  font-size: 12px;
  color: #777;
  line-height: 1.7;
  word-break: keep-all;
}

.status.error {
  color: #d33;
}

.status.success {
  color: #16834a;
}

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}

.result-header h2 {
  font-size: 18px;
  margin: 0;
}

.result-count {
  font-size: 13px;
  color: #777;
}

.refresh-button {
  height: 34px;
  padding: 0 13px;
  font-size: 12px;
  background: #65758b;
}

.table-wrapper {
  overflow-x: auto;
  border: 1px solid #e5e8ed;
  border-radius: 8px;
}

.result-scroll {
  max-height: 345px;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
  font-size: 14px;
}

thead {
  background: #f2f5fa;
  position: sticky;
  top: 0;
  z-index: 1;
}

th, td {
  padding: 13px 12px;
  border-bottom: 1px solid #e9edf2;
  text-align: center;
  white-space: nowrap;
}

th {
  font-weight: bold;
  color: #444;
}

td.name {
  text-align: left;
  white-space: normal;
  min-width: 180px;
}

td.price {
  font-weight: bold;
  color: #205fc4;
}

.empty {
  text-align: center;
  padding: 45px 10px;
  color: #999;
  font-size: 14px;
}

/* 로그인 */
.login-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(20,30,45,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 360px;
  background: #fff;
  border-radius: 14px;
  padding: 30px;
  text-align: center;
}

.login-box h2 {
  margin: 0 0 10px;
}

.login-box p {
  color: #777;
  font-size: 13px;
  margin-bottom: 22px;
}

.login-box input {
  margin-bottom: 12px;
  text-align: center;
}

.login-box button {
  width: 100%;
}

.login-error {
  color: #d33;
  font-size: 12px;
  margin-top: 10px;
  min-height: 16px;
}

.hidden {
  display: none !important;
}

/* 모바일 전용 카드 */
.mobile-results {
  display: none;
}

@media (max-width: 650px) {
  body {
    padding: 18px 12px;
  }

  h1 {
    font-size: 23px;
  }

  .subtitle {
    margin-bottom: 18px;
    font-size: 12px;
  }

  .panel {
    padding: 16px;
    border-radius: 11px;
    margin-bottom: 13px;
  }

  .form-row {
    flex-direction: column;
    gap: 14px;
    margin-bottom: 14px;
  }

  input, select {
    height: 48px;
    font-size: 16px;
  }

  .search-button {
    width: 100%;
    height: 48px;
  }

  .status {
    font-size: 11px;
  }

  .result-header h2 {
    font-size: 17px;
  }

  .result-header {
    align-items: center;
  }

  .table-wrapper {
    border: none;
    overflow: visible;
  }

  .result-scroll {
    max-height: 520px;
    overflow-y: auto;
    padding: 1px 2px 5px;
  }

  /* PC 표 숨기기 */
  .desktop-results {
    display: none;
  }

  /* 모바일 카드 표시 */
  .mobile-results {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .product-card {
    border: 1px solid #e3e8ef;
    border-radius: 10px;
    padding: 14px;
    background: #fff;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding-bottom: 11px;
    border-bottom: 1px solid #edf0f4;
  }

  .card-name {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.45;
    word-break: keep-all;
    overflow-wrap: anywhere;
    flex: 1;
  }

  .card-barcode {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    padding-top: 2px;
  }

  .card-spec {
    margin-top: 8px;
    font-size: 12px;
    color: #777;
  }

  .card-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 13px 0;
  }

  .info-label {
    display: block;
    font-size: 11px;
    color: #888;
    margin-bottom: 5px;
  }

  .info-value {
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }

  .card-price {
    background: #f1f6ff;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .card-price-label {
    font-size: 12px;
    color: #536b8d;
    font-weight: bold;
  }

  .card-price-value {
    font-size: 19px;
    color: #205fc4;
    font-weight: bold;
    text-align: right;
  }

  .rate-warning {
    color: #d33;
    font-size: 12px;
    font-weight: normal;
  }

  .empty {
    padding: 38px 10px;
    font-size: 13px;
    background: #fff;
    border-radius: 8px;
  }

  .refresh-button {
    height: 32px;
    padding: 0 11px;
  }
}
</style>
</head>

<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>상품 단가 조회</h2>
    <p>비밀번호를 입력해 주세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호">
    <button id="loginButton" type="button">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="container">

  <h1>상품 단가 조회</h1>
  <div class="subtitle">거래처별 상품 판매 단가를 확인할 수 있습니다.</div>

  <section class="panel">

    <div class="form-row">
      <div class="field">
        <label for="customerSelect">거래처 선택</label>
        <select id="customerSelect">
          <option value="">거래처를 선택해 주세요.</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="searchInput">상품명 또는 바코드 검색</label>
        <input
          type="text"
          id="searchInput"
          placeholder="상품명 또는 바코드를 입력하세요."
        >
      </div>
      <button class="search-button" id="searchButton" type="button">검색</button>
    </div>

    <div class="status" id="status">데이터를 불러오는 중입니다.</div>
  </section>

  <section class="panel">

    <div class="result-header">
      <h2>검색 결과</h2>
      <div>
        <span class="result-count" id="resultCount">0개 상품</span>
        <button class="refresh-button" id="refreshButton" type="button">새로고침</button>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="result-scroll" id="resultScroll">

        <!-- PC용 표 -->
        <div class="desktop-results">
          <table>
            <thead>
              <tr>
                <th>바코드</th>
                <th>상품명</th>
                <th>규격</th>
                <th>소매가</th>
                <th>적용 단가율</th>
                <th>거래처 단가</th>
              </tr>
            </thead>
            <tbody id="resultBody">
              <tr>
                <td colspan="6" class="empty">거래처와 상품을 검색해 주세요.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 모바일용 카드 -->
        <div class="mobile-results" id="mobileResults">
          <div class="empty">거래처와 상품을 검색해 주세요.</div>
        </div>

      </div>
    </div>
  </section>

</div>

<script>
const SPREADSHEET_ID =
  "19WlE1Iou4tsuqdb5qACWUheZeX3-F1ccNKs4_IucepQ";

const PRODUCT_GID = "1714186521";
const CUSTOMER_GID = "100929157";

const LOGIN_PASSWORD = "2221";
const AUTO_REFRESH_MS = 60000;

let products = [];
let customers = [];
let makerHeaders = [];

let productLoaded = false;
let customerLoaded = false;

function normalizeText(value) {
  return String(value ?? "")
    .normalize("NFKC")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "");
}

function normalizeBarcode(value) {
  let barcode = String(value ?? "")
    .trim()
    .replace(/\.0$/, "")
    .replace(/[^0-9]/g, "");

  barcode = barcode.replace(/^0+/, "");

  return barcode || "0";
}

function getCellValue(row, index) {
  const cell = row?.c?.[index];

  if (!cell || cell.v === null || cell.v === undefined) {
    return "";
  }

  return cell.v;
}

function formatNumber(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) return "-";

  return Math.floor(number).toLocaleString("ko-KR");
}

function formatRate(rate) {
  if (!Number.isFinite(rate)) return "-";

  const percent = rate * 100;

  return Number.isInteger(percent)
    ? percent.toLocaleString("ko-KR") + "%"
    : percent.toLocaleString("ko-KR", {
        maximumFractionDigits: 2
      }) + "%";
}

function parseRate(value) {
  if (value === null || value === undefined || value === "") {
    return null;
  }

  let text = String(value).trim();

  if (!text) return null;

  const hasPercent = text.includes("%");

  text = text.replace(/,/g, "").replace(/%/g, "").trim();

  const number = Number(text);

  if (!Number.isFinite(number) || number < 0) return null;

  if (hasPercent) return number / 100;

  return number > 1 ? number / 100 : number;
}

function loadSheet(gid) {
  return new Promise((resolve, reject) => {

    const callbackName =
      "sheetCallback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SPREADSHEET_ID +
      "/gviz/tq?gid=" +
      encodeURIComponent(gid) +
      "&headers=1&tqx=" +
      encodeURIComponent("out:json;responseHandler:" + callbackName);

    let finished = false;

    const timeout = setTimeout(() => {
      finish(new Error("시트 응답 시간이 초과되었습니다."));
    }, 25000);

    function finish(error, result) {
      if (finished) return;

      finished = true;
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();

      if (error) reject(error);
      else resolve(result);
    }

    window[callbackName] = function(response) {

      if (!response || !response.table) {
        finish(new Error("시트 데이터를 읽지 못했습니다."));
        return;
      }

      if (
        response.status &&
        String(response.status).toLowerCase() !== "ok"
      ) {
        finish(new Error(
          response.errors?.[0]?.detailed_message ||
          "시트 데이터를 읽지 못했습니다."
        ));
        return;
      }

      finish(null, response.table);
    };

    script.onerror = () => {
      finish(new Error("스프레드시트 연결에 실패했습니다. 공유 권한을 확인해 주세요."));
    };

    script.src = url;
    document.head.appendChild(script);
  });
}

function parseProducts(table) {
  const result = [];

  (table.rows || []).forEach(row => {

    const barcode = String(getCellValue(row, 0)).trim();
    const category = String(getCellValue(row, 1)).trim();
    const maker = String(getCellValue(row, 2)).trim();
    const name = String(getCellValue(row, 3)).trim();
    const spec = String(getCellValue(row, 4)).trim();

    const retailRaw = getCellValue(row, 5);

    const retailPrice = Number(
      String(retailRaw)
        .replace(/,/g, "")
        .replace(/원/g, "")
        .trim()
    );

    if (!name) return;

    result.push({
      barcode,
      category,
      maker,
      name,
      spec,
      retailPrice: Number.isFinite(retailPrice)
        ? retailPrice
        : null
    });
  });

  return result;
}

function parseCustomers(table) {
  const rows = table.rows || [];
  const cols = table.cols || [];

  // B열부터 메이커명
  makerHeaders = cols
    .slice(1)
    .map(col => String(col.label || col.id || "").trim());

  const result = [];

  // rows[0]은 시트의 2행이므로 건너뛰지 않음
  rows.forEach(row => {

    // A열은 거래처명
    const customerName = String(getCellValue(row, 0)).trim();

    if (!customerName) return;

    const rates = {};

    makerHeaders.forEach((makerName, index) => {
      if (!makerName) return;

      const value = getCellValue(row, index + 1);

      rates[normalizeText(makerName)] = parseRate(value);
    });

    result.push({
      name: customerName,
      rates
    });
  });

  return result;
}

async function loadAllData() {
  const status = document.getElementById("status");
  const refreshButton = document.getElementById("refreshButton");

  status.className = "status";
  status.textContent = "상품 및 거래처 데이터를 불러오는 중입니다.";
  refreshButton.disabled = true;

  try {
    const [productTable, customerTable] = await Promise.all([
      loadSheet(PRODUCT_GID),
      loadSheet(CUSTOMER_GID)
    ]);

    products = parseProducts(productTable);
    customers = parseCustomers(customerTable);

    productLoaded = true;
    customerLoaded = true;

    updateCustomerSelect();

    status.className = "status success";
    status.textContent =
      "상품 " + products.length.toLocaleString("ko-KR") +
      "개 / 거래처 " + customers.length.toLocaleString("ko-KR") +
      "개 데이터 갱신 완료 · " +
      new Date().toLocaleTimeString("ko-KR");

    if (document.getElementById("searchInput").value.trim()) {
      searchProducts();
    }

  } catch (error) {
    console.error(error);
    status.className = "status error";
    status.textContent = "데이터 불러오기 실패: " + error.message;

  } finally {
    refreshButton.disabled = false;
  }
}

function updateCustomerSelect() {
  const select = document.getElementById("customerSelect");
  const previousValue = select.value;

  select.innerHTML =
    '<option value="">거래처를 선택해 주세요.</option>';

  customers.forEach(customer => {
    const option = document.createElement("option");
    option.value = customer.name;
    option.textContent = customer.name;
    select.appendChild(option);
  });

  if (customers.some(c => c.name === previousValue)) {
    select.value = previousValue;
  }
}

function getSelectedCustomer() {
  const name = document.getElementById("customerSelect").value;

  return customers.find(customer => customer.name === name) || null;
}

function showEmpty(message) {
  document.getElementById("resultBody").innerHTML =
    '<tr><td colspan="6" class="empty">' + message + '</td></tr>';

  document.getElementById("mobileResults").innerHTML =
    '<div class="empty">' + message + '</div>';

  document.getElementById("resultCount").textContent = "0개 상품";
}

function createInfo(label, value) {
  const box = document.createElement("div");

  const labelElement = document.createElement("span");
  labelElement.className = "info-label";
  labelElement.textContent = label;

  const valueElement = document.createElement("span");
  valueElement.className = "info-value";
  valueElement.textContent = value;

  box.appendChild(labelElement);
  box.appendChild(valueElement);

  return box;
}

function createMobileCard(product, rate) {
  const card = document.createElement("div");
  card.className = "product-card";

  const top = document.createElement("div");
  top.className = "card-top";

  const titleArea = document.createElement("div");

  const name = document.createElement("div");
  name.className = "card-name";
  name.textContent = product.name;

  const spec = document.createElement("div");
  spec.className = "card-spec";
  spec.textContent = "규격: " + (product.spec || "-");

  titleArea.appendChild(name);
  titleArea.appendChild(spec);

  const barcode = document.createElement("div");
  barcode.className = "card-barcode";
  barcode.textContent = product.barcode || "-";

  top.appendChild(titleArea);
  top.appendChild(barcode);

  const info = document.createElement("div");
  info.className = "card-info";

  info.appendChild(createInfo(
    "소매가",
    product.retailPrice === null
      ? "-"
      : formatNumber(product.retailPrice) + "원"
  ));

  info.appendChild(createInfo(
    "적용 단가율",
    rate === null ? "확인 필요" : formatRate(rate)
  ));

  const priceArea = document.createElement("div");
  priceArea.className = "card-price";

  const priceLabel = document.createElement("span");
  priceLabel.className = "card-price-label";
  priceLabel.textContent = "거래처 단가";

  const priceValue = document.createElement("span");
  priceValue.className = "card-price-value";

  if (rate === null) {
    priceValue.className += " rate-warning";
    priceValue.textContent = "단가율 없음";
  } else if (product.retailPrice === null) {
    priceValue.textContent = "소매가 확인 필요";
  } else {
    priceValue.textContent =
      formatNumber(Math.floor(product.retailPrice * rate)) + "원";
  }

  priceArea.appendChild(priceLabel);
  priceArea.appendChild(priceValue);

  card.appendChild(top);
  card.appendChild(info);
  card.appendChild(priceArea);

  return card;
}

function searchProducts() {
  const query = document.getElementById("searchInput").value.trim();
  const customer = getSelectedCustomer();

  if (!productLoaded || !customerLoaded) {
    showEmpty("데이터를 불러오는 중입니다.");
    return;
  }

  if (!customer) {
    showEmpty("거래처를 먼저 선택해 주세요.");
    return;
  }

  if (!query) {
    showEmpty("상품명 또는 바코드를 입력해 주세요.");
    return;
  }

  const normalizedQuery = normalizeText(query);
  const numericQuery = /^\d+$/.test(query);

  const normalizedBarcodeQuery =
    numericQuery ? normalizeBarcode(query) : "";

  const matchedProducts = products.filter(product => {

    const nameMatch =
      normalizeText(product.name).includes(normalizedQuery);

    const barcodeMatch =
      numericQuery &&
      normalizeBarcode(product.barcode) === normalizedBarcodeQuery;

    return nameMatch || barcodeMatch;
  });

  const resultBody = document.getElementById("resultBody");
  const mobileResults = document.getElementById("mobileResults");

  resultBody.innerHTML = "";
  mobileResults.innerHTML = "";

  document.getElementById("resultCount").textContent =
    matchedProducts.length.toLocaleString("ko-KR") + "개 상품";

  document.getElementById("resultScroll").scrollTop = 0;

  if (matchedProducts.length === 0) {
    showEmpty("검색 결과가 없습니다.");
    return;
  }

  matchedProducts.forEach(product => {

    const rate = customer.rates[normalizeText(product.maker)];

    // PC 표
    const tr = document.createElement("tr");

    const values = [
      product.barcode || "-",
      product.name,
      product.spec || "-",
      product.retailPrice === null
        ? "-"
        : formatNumber(product.retailPrice) + "원",
      rate === null || rate === undefined
        ? "확인 필요"
        : formatRate(rate),
      rate === null || rate === undefined
        ? "단가율 없음"
        : product.retailPrice === null
          ? "소매가 확인 필요"
          : formatNumber(Math.floor(product.retailPrice * rate)) + "원"
    ];

    values.forEach((value, index) => {
      const td = document.createElement("td");

      if (index === 1) td.className = "name";
      if (index === 5) td.className = "price";

      if (
        (index === 4 || index === 5) &&
        (rate === null || rate === undefined)
      ) {
        td.className += " rate-warning";
      }

      td.textContent = value;
      tr.appendChild(td);
    });

    resultBody.appendChild(tr);

    // 모바일 카드
    mobileResults.appendChild(
      createMobileCard(product, rate)
    );
  });
}

function login() {
  const password = document.getElementById("passwordInput").value;
  const error = document.getElementById("loginError");

  if (password === LOGIN_PASSWORD) {
    document.getElementById("loginOverlay").classList.add("hidden");
    sessionStorage.setItem("productLogin", "true");
    loadAllData();
  } else {
    error.textContent = "비밀번호가 일치하지 않습니다.";
    document.getElementById("passwordInput").value = "";
    document.getElementById("passwordInput").focus();
  }
}

document.getElementById("loginButton").addEventListener("click", login);

document.getElementById("passwordInput").addEventListener("keydown", event => {
  if (event.key === "Enter") login();
});

document.getElementById("searchButton").addEventListener("click", searchProducts);

document.getElementById("searchInput").addEventListener("keydown", event => {
  if (event.key === "Enter") searchProducts();
});

document.getElementById("customerSelect").addEventListener("change", () => {
  if (document.getElementById("searchInput").value.trim()) {
    searchProducts();
  }
});

document.getElementById("refreshButton").addEventListener("click", loadAllData);

if (sessionStorage.getItem("productLogin") === "true") {
  document.getElementById("loginOverlay").classList.add("hidden");
  loadAllData();
}

setInterval(() => {
  if (sessionStorage.getItem("productLogin") === "true") {
    loadAllData();
  }
}, AUTO_REFRESH_MS);
</script>

</body>
</html>
