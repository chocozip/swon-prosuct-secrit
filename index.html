<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>거래처 상품 단가 조회</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f4f6f9;
      color: #202938;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #687386;
      font-size: 14px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.045);
    }

    .login-box {
      max-width: 420px;
      margin: 80px auto;
      text-align: center;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #d7dce5;
      border-radius: 8px;
      background: white;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #4778d8;
      box-shadow: 0 0 0 3px rgba(71,120,216,.1);
    }

    button {
      min-height: 46px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #3267cc;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #2455b3;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .login-box button {
      width: 100%;
      margin-top: 12px;
    }

    .error {
      color: #d33b3b;
      font-size: 13px;
      margin-top: 12px;
    }

    .search-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #596579;
    }

    .search-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .search-actions button:first-child {
      flex: 1;
    }

    .secondary {
      background: #e9edf4;
      color: #354052;
    }

    .secondary:hover {
      background: #dce2ec;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      color: #6c7788;
      font-size: 12px;
    }

    .status strong {
      color: #3267cc;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .result-heading h2 {
      font-size: 18px;
      margin: 0;
    }

    .count {
      color: #3267cc;
      font-size: 13px;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
      font-size: 13px;
    }

    th {
      padding: 13px 10px;
      background: #f4f6fa;
      color: #596579;
      text-align: center;
      white-space: nowrap;
      border-bottom: 1px solid #e4e8ef;
    }

    td {
      padding: 14px 10px;
      text-align: center;
      border-bottom: 1px solid #edf0f4;
      white-space: nowrap;
    }

    td.product-name {
      text-align: left;
      white-space: normal;
      min-width: 180px;
      font-weight: 700;
    }

    .price {
      font-weight: 700;
      color: #3267cc;
    }

    .empty {
      padding: 45px 15px;
      text-align: center;
      color: #8993a3;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #9aa2af;
    }

    @media (max-width: 650px) {
      body {
        padding: 18px 12px;
      }

      .panel {
        padding: 17px;
      }

      h1 {
        font-size: 21px;
      }

      .search-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .search-actions {
        flex-direction: column;
      }

      .search-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div id="loginSection" class="panel login-box">
      <h1>상품 단가 조회</h1>
      <p class="subtitle">직원 전용 상품 가격 조회 시스템</p>

      <input
        type="password"
        id="passwordInput"
        placeholder="접속 비밀번호 입력"
        autocomplete="current-password"
      >

      <button id="loginButton" onclick="login()">로그인</button>
      <div id="loginError" class="error"></div>
    </div>

    <div id="mainSection" class="hidden">

      <div class="header">
        <h1>상품 단가 조회</h1>
        <div class="subtitle">
          거래처를 선택하고 상품명 또는 바코드로 검색하세요.
        </div>
      </div>

      <div class="panel">
        <div class="search-grid">

          <div class="field">
            <label for="customerSelect">거래처 선택</label>
            <select id="customerSelect">
              <option value="">거래처를 선택하세요</option>
            </select>
          </div>

          <div class="field">
            <label for="searchInput">상품명 / 바코드 검색</label>
            <input
              id="searchInput"
              type="text"
              placeholder="상품명 또는 바코드 입력"
              onkeydown="if(event.key==='Enter') searchProducts()"
            >
          </div>

        </div>

        <div class="search-actions">
          <button onclick="searchProducts()">상품 검색</button>
          <button class="secondary" onclick="resetSearch()">초기화</button>
        </div>
      </div>

      <div class="panel">
        <div class="status">
          <span id="dataStatus">데이터 연결 중...</span>
          <span>자동 갱신: <strong>60초</strong></span>
        </div>
      </div>

      <div class="panel">
        <div class="result-heading">
          <h2>검색 결과</h2>
          <span class="count" id="resultCount">0개</span>
        </div>

        <div id="resultArea">
          <div class="empty">거래처와 검색어를 입력해 주세요.</div>
        </div>
      </div>

      <div class="footer">
        상품 가격은 구글 스프레드시트 기준으로 표시됩니다.
      </div>

    </div>
  </div>

<script>
  // ==========================================
  // 기본 설정
  // ==========================================

  const LOGIN_PASSWORD = "2221";

  const SHEET_ID =
    "19WlE1Iou4tsuqdb5qACWUheZeX3-F1ccNKs4_IucepQ";

  const PRODUCT_SHEET = "상품리스트";
  const PRODUCT_GID = "1714186521";
  const CUSTOMER_SHEET = "거래처별단가";

  const REFRESH_INTERVAL = 60 * 1000;

  let products = [];
  let customers = [];
  let makerHeaders = [];

  let isLoading = false;
  let refreshTimer = null;


  // ==========================================
  // 로그인
  // ==========================================

  function login() {
    const password =
      document.getElementById("passwordInput").value;

    if (password !== LOGIN_PASSWORD) {
      document.getElementById("loginError").textContent =
        "비밀번호가 올바르지 않습니다.";
      return;
    }

    document.getElementById("loginSection")
      .classList.add("hidden");

    document.getElementById("mainSection")
      .classList.remove("hidden");

    loadData();
  }


  // ==========================================
  // Google Sheets 데이터 불러오기
  // ==========================================

  function loadSheet(sheetName, gid = null) {
    return new Promise((resolve, reject) => {

      const callbackName =
        "googleSheetCallback_" +
        Date.now() + "_" +
        Math.random().toString(36).slice(2);

      const script = document.createElement("script");

      const params = new URLSearchParams();

      if (gid) {
        params.set("gid", gid);
      } else {
        params.set("sheet", sheetName);
      }

      params.set("headers", "1");
      params.set(
        "tqx",
        "out:json;responseHandler:" + callbackName
      );

      const url =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?" +
        params.toString();

      let completed = false;

      const timeout = setTimeout(() => {
        finish(
          new Error(
            sheetName +
            " 연결 시간 초과. 구글 시트 공유 설정을 확인하세요."
          )
        );
      }, 20000);

      function finish(error, data) {
        if (completed) return;

        completed = true;
        clearTimeout(timeout);

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        if (error) {
          reject(error);
        } else {
          resolve(data);
        }
      }

      window[callbackName] = function(response) {

        if (!response) {
          finish(
            new Error(sheetName + " 응답 데이터가 비어 있습니다.")
          );
          return;
        }

        if (response.status === "error") {
          const message =
            response.errors?.map(e =>
              e.detailed_message || e.message
            ).join(" / ") || "알 수 없는 오류";

          finish(
            new Error(sheetName + " 오류: " + message)
          );
          return;
        }

        if (!response.table) {
          finish(
            new Error(sheetName + " 데이터 형식이 올바르지 않습니다.")
          );
          return;
        }

        finish(null, response.table);
      };

      script.src = url;

      script.onerror = function() {
        finish(
          new Error(
            sheetName +
            " 연결 실패. 스프레드시트 ID와 공유 권한을 확인하세요."
          )
        );
      };

      document.head.appendChild(script);
    });
  }


  // ==========================================
  // 셀 값 가져오기
  // ==========================================

  function getCellValue(row, index) {
    if (!row || !row.c || !row.c[index]) {
      return "";
    }

    const cell = row.c[index];

    if (cell.v !== null && cell.v !== undefined) {
      return cell.v;
    }

    if (cell.f !== null && cell.f !== undefined) {
      return cell.f;
    }

    return "";
  }


  // ==========================================
  // 숫자 변환
  // ==========================================

  function toNumber(value) {
    if (typeof value === "number") {
      return value;
    }

    if (value === null || value === undefined) {
      return NaN;
    }

    const cleaned = String(value)
      .replace(/,/g, "")
      .replace(/[₩원\s]/g, "")
      .trim();

    if (!cleaned) return NaN;

    const number = Number(cleaned);

    return Number.isFinite(number) ? number : NaN;
  }


  // ==========================================
  // 단가율 변환
  // ==========================================

  function parseRate(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return null;
    }

    let rate;

    if (typeof value === "string") {
      const text = value.trim();

      if (!text) return null;

      if (text.includes("%")) {
        rate = Number(
          text.replace("%", "").replace(/,/g, "").trim()
        ) / 100;
      } else {
        rate = toNumber(text);
      }
    } else {
      rate = Number(value);
    }

    if (!Number.isFinite(rate)) {
      return null;
    }

    // 49.5 형태는 49.5%로 처리
    // 0.495 형태는 49.5%로 처리
    if (rate > 1) {
      rate = rate / 100;
    }

    return rate;
  }


  // ==========================================
  // 데이터 전체 불러오기
  // ==========================================

  async function loadData() {
    if (isLoading) return;

    isLoading = true;

    setStatus("구글 시트 데이터를 불러오는 중입니다...");

    try {

      const [productTable, customerTable] =
        await Promise.all([
          loadSheet(PRODUCT_SHEET, PRODUCT_GID),
          loadSheet(CUSTOMER_SHEET)
        ]);

      // 상품 데이터 처리
      const newProducts = [];

      for (const row of productTable.rows || []) {

        const barcode = getCellValue(row, 0);
        const category = getCellValue(row, 1);
        const maker = getCellValue(row, 2);
        const name = getCellValue(row, 3);
        const spec = getCellValue(row, 4);
        const retailPrice = getCellValue(row, 5);

        if (!name && !barcode) continue;

        newProducts.push({
          barcode: String(barcode ?? "").trim(),
          category: String(category ?? "").trim(),
          maker: String(maker ?? "").trim(),
          name: String(name ?? "").trim(),
          spec: String(spec ?? "").trim(),
          retailPrice: toNumber(retailPrice)
        });
      }


      // 거래처 단가 데이터 처리
      const newMakerHeaders =
        (customerTable.cols || [])
          .slice(1)
          .map(col =>
            String(col.label || col.id || "").trim()
          );

      const newCustomers = [];

      for (const row of customerTable.rows || []) {

        const customerName =
          String(getCellValue(row, 0) ?? "").trim();

        if (!customerName) continue;

        const rates = {};

        newMakerHeaders.forEach((maker, index) => {
          rates[maker] =
            parseRate(getCellValue(row, index + 1));
        });

        newCustomers.push({
          name: customerName,
          rates: rates
        });
      }


      // 데이터 반영
      products = newProducts;
      customers = newCustomers;
      makerHeaders = newMakerHeaders;

      updateCustomerSelect();

      setStatus(
        "정상 연결 | 상품 " +
        products.length +
        "개 | 거래처 " +
        customers.length +
        "개 | 마지막 갱신 " +
        new Date().toLocaleTimeString("ko-KR")
      );

      // 자동 갱신 시 기존 검색 결과도 다시 표시
      const searchValue =
        document.getElementById("searchInput").value;

      if (searchValue.trim()) {
        searchProducts();
      }

    } catch (error) {

      console.error(error);

      setStatus("데이터 연결 오류");

      document.getElementById("resultArea").innerHTML =
        '<div class="empty error">' +
        escapeHtml(error.message) +
        '<br><br>구글 시트 공유 설정과 탭 이름을 확인하세요.' +
        '</div>';

    } finally {
      isLoading = false;
    }

    // 60초마다 자동 갱신
    if (!refreshTimer) {
      refreshTimer = setInterval(
        loadData,
        REFRESH_INTERVAL
      );
    }
  }


  // ==========================================
  // 거래처 선택 목록
  // ==========================================

  function updateCustomerSelect() {
    const select =
      document.getElementById("customerSelect");

    const previousValue = select.value;

    select.innerHTML =
      '<option value="">거래처를 선택하세요</option>';

    customers.forEach(customer => {
      const option = document.createElement("option");

      option.value = customer.name;
      option.textContent = customer.name;

      select.appendChild(option);
    });

    if (
      customers.some(c => c.name === previousValue)
    ) {
      select.value = previousValue;
    }
  }


  // ==========================================
  // 바코드 비교
  // 앞자리 0 무시
  // ==========================================

  function normalizeBarcode(value) {
    return String(value ?? "")
      .trim()
      .replace(/\s/g, "")
      .replace(/^0+/, "") || "0";
  }


  // ==========================================
  // 상품 검색
  // ==========================================

  function searchProducts() {

    const customerName =
      document.getElementById("customerSelect").value;

    const searchText =
      document.getElementById("searchInput")
        .value.trim();

    if (!customerName) {
      showMessage("먼저 거래처를 선택해 주세요.");
      return;
    }

    if (!searchText) {
      showMessage("상품명 또는 바코드를 입력해 주세요.");
      return;
    }

    const customer =
      customers.find(c => c.name === customerName);

    if (!customer) {
      showMessage("선택한 거래처 정보를 찾을 수 없습니다.");
      return;
    }

    const searchBarcode = normalizeBarcode(searchText);

    const isBarcode =
      /^[0-9]+$/.test(searchText.replace(/\s/g, ""));

    let results;

    if (isBarcode) {

      // 바코드는 정확히 일치하는 상품만 검색
      results = products.filter(product =>
        normalizeBarcode(product.barcode) === searchBarcode
      );

    } else {

      // 상품명은 부분 일치 검색
      const keyword = searchText.toLowerCase();

      results = products.filter(product =>
        product.name.toLowerCase().includes(keyword)
      );
    }

    renderResults(results, customer);
  }


  // ==========================================
  // 검색 결과 표시
  // ==========================================

  function renderResults(results, customer) {

    document.getElementById("resultCount").textContent =
      results.length + "개";

    if (!results.length) {
      showMessage("검색 결과가 없습니다.");
      return;
    }

    let html = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>상품분류</th>
              <th>상품명</th>
              <th>바코드</th>
              <th>규격</th>
              <th>소매가</th>
              <th>단가율</th>
              <th>거래처 단가</th>
            </tr>
          </thead>
          <tbody>
    `;

    results.forEach(product => {

      const rate =
        customer.rates[product.maker];

      let rateText = "-";
      let customerPriceText = "-";

      if (
        rate !== null &&
        rate !== undefined &&
        Number.isFinite(product.retailPrice)
      ) {

        rateText =
          (rate * 100).toLocaleString("ko-KR", {
            maximumFractionDigits: 2
          }) + "%";

        const customerPrice =
          Math.floor(product.retailPrice * rate);

        customerPriceText =
          customerPrice.toLocaleString("ko-KR") + "원";
      }

      html += `
        <tr>
          <td>${escapeHtml(product.category || "-")}</td>
          <td class="product-name">
            ${escapeHtml(product.name || "-")}
          </td>
          <td>${escapeHtml(product.barcode || "-")}</td>
          <td>${escapeHtml(product.spec || "-")}</td>
          <td>
            ${formatPrice(product.retailPrice)}
          </td>
          <td>${rateText}</td>
          <td class="price">${customerPriceText}</td>
        </tr>
      `;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;

    document.getElementById("resultArea").innerHTML = html;
  }


  // ==========================================
  // 가격 표시
  // ==========================================

  function formatPrice(value) {
    if (!Number.isFinite(value)) {
      return "-";
    }

    return value.toLocaleString("ko-KR") + "원";
  }


  // ==========================================
  // 결과 메시지
  // ==========================================

  function showMessage(message) {
    document.getElementById("resultCount").textContent = "0개";

    document.getElementById("resultArea").innerHTML =
      '<div class="empty">' +
      escapeHtml(message) +
      '</div>';
  }


  // ==========================================
  // HTML 문자 처리
  // ==========================================

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => {
      const entities = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };

      return entities[char];
    });
  }


  // ==========================================
  // 상태 표시
  // ==========================================

  function setStatus(message) {
    document.getElementById("dataStatus").textContent =
      message;
  }


  // ==========================================
  // 검색 초기화
  // ==========================================

  function resetSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("customerSelect").value = "";

    document.getElementById("resultCount").textContent = "0개";

    document.getElementById("resultArea").innerHTML =
      '<div class="empty">거래처와 검색어를 입력해 주세요.</div>';
  }

</script>
</body>
</html>
