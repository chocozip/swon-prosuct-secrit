
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상품 단가 조회</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  background: #f4f6f9;
  color: #222;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
}

.header { margin-bottom: 22px; }

h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

.sub-title {
  color: #777;
  font-size: 13px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.login-area {
  max-width: 420px;
  margin: 80px auto;
  text-align: center;
}

input, select, button {
  width: 100%;
  height: 46px;
  border-radius: 8px;
  font-size: 15px;
}

input, select {
  border: 1px solid #ddd;
  padding: 0 12px;
  background: white;
}

button {
  border: none;
  background: #2457d6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #1948bd; }

.login-area input { margin: 14px 0 10px; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 14px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: bold;
}

.search-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.search-row input {
  flex: 1;
  min-width: 0;
}

.search-row button {
  width: 110px;
  flex-shrink: 0;
}

.status {
  margin-top: 14px;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}

.result-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.result-title h2 {
  margin: 0;
  font-size: 18px;
}

.result-count {
  color: #666;
  font-size: 13px;
}

.table-wrap {
  max-height: 390px;
  overflow: auto;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
  font-size: 13px;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: center;
  white-space: nowrap;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: #f1f4f8;
  font-weight: bold;
}

td.product-name {
  text-align: left;
  white-space: normal;
  min-width: 170px;
}

td.price {
  font-weight: bold;
  color: #2457d6;
}

td.rate { color: #444; }

.empty {
  padding: 35px 10px;
  color: #888;
  text-align: center;
}

.error { color: #d33; }

.hidden { display: none; }

@media (max-width: 600px) {
  body { padding: 16px 10px; }
  h1 { font-size: 21px; }
  .panel { padding: 15px; }
  .form-grid { grid-template-columns: 1fr; }
  .search-row button { width: 85px; }
}
</style>
</head>

<body>

<div id="loginScreen" class="container">
  <div class="panel login-area">
    <h1>상품 단가 조회</h1>
    <p class="sub-title">직원 전용 상품 가격 조회 시스템</p>

    <input
      type="password"
      id="password"
      placeholder="비밀번호 입력"
      onkeydown="if(event.key === 'Enter') login()"
    >

    <button onclick="login()">로그인</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<div id="mainScreen" class="container hidden">

  <div class="header">
    <h1>상품 단가 조회</h1>
    <div class="sub-title">거래처별 상품 판매 단가 확인</div>
  </div>

  <div class="panel">
    <div class="form-grid">

      <div class="field">
        <label for="customerSelect">거래처 선택</label>
        <select id="customerSelect" onchange="searchProducts()">
          <option value="">거래처 불러오는 중...</option>
        </select>
      </div>

      <div class="field">
        <label for="searchInput">상품명 또는 바코드 검색</label>
        <input
          type="text"
          id="searchInput"
          placeholder="상품명 일부 또는 바코드 전체 입력"
          onkeydown="if(event.key === 'Enter') searchProducts()"
        >
      </div>

    </div>

    <div class="search-row">
      <button onclick="searchProducts()">검색</button>
    </div>

    <div id="status" class="status">
      구글 시트 데이터를 불러오고 있습니다.
    </div>
  </div>

  <div class="panel">
    <div class="result-title">
      <h2>검색 결과</h2>
      <span id="resultCount" class="result-count">0개</span>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>상품분류</th>
            <th>상품명</th>
            <th>바코드</th>
            <th>규격</th>
            <th>소매가</th>
            <th>단가율</th>
            <th>적용 단가</th>
          </tr>
        </thead>

        <tbody id="resultBody">
          <tr>
            <td colspan="7" class="empty">상품을 검색해 주세요.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>

// ==========================================
// 구글 시트 설정
// ==========================================

const SPREADSHEET_ID =
  "19WlE1Iou4tsuqdb5qACWUheZeX3-F1ccNKs4_IucepQ";

const PRODUCT_GID = "1714186521";
const CUSTOMER_GID = "0";

const LOGIN_PASSWORD = "2221";

let products = [];
let customers = [];
let makerHeaders = [];

let productLoaded = false;
let customerLoaded = false;


// ==========================================
// 로그인
// ==========================================

function login() {
  const password = document.getElementById("password").value;

  if (password === LOGIN_PASSWORD) {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("mainScreen").classList.remove("hidden");
    loadAllData();
  } else {
    document.getElementById("loginError").textContent =
      "비밀번호가 올바르지 않습니다.";
  }
}


// ==========================================
// 공통 함수
// ==========================================

function normalizeText(value) {
  return String(value ?? "")
    .trim()
    .replace(/\s+/g, "")
    .toLowerCase();
}

function normalizeBarcode(value) {
  const digits = String(value ?? "").replace(/\D/g, "");
  return digits.replace(/^0+/, "") || "0";
}

function formatNumber(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) return "-";

  return Math.floor(number).toLocaleString("ko-KR");
}

function parseNumber(value) {
  if (value === null || value === undefined || value === "") {
    return null;
  }

  const number = Number(String(value).replace(/,/g, "").trim());

  return Number.isFinite(number) ? number : null;
}

function parseRate(value) {
  if (value === null || value === undefined || value === "") {
    return null;
  }

  let text = String(value).trim();

  if (!text) return null;

  const hasPercent = text.includes("%");
  text = text.replace(/[%\s,]/g, "");

  const number = Number(text);

  if (!Number.isFinite(number)) return null;

  if (hasPercent) return number / 100;
  if (number > 1) return number / 100;

  return number;
}

function getCellValue(row, index) {
  const cell = row?.c?.[index];

  if (!cell) return null;

  return cell.v ?? cell.f ?? null;
}


// ==========================================
// 구글 시트 연결
// ==========================================

function loadSheet(gid) {
  return new Promise((resolve, reject) => {

    const callbackName =
      "googleSheetCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);

    const params = new URLSearchParams();

    params.set("gid", gid);
    params.set("headers", "1");
    params.set(
      "tqx",
      "out:json;responseHandler:" + callbackName
    );

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SPREADSHEET_ID +
      "/gviz/tq?" +
      params.toString();

    const script = document.createElement("script");

    let finished = false;

    const timeout = setTimeout(() => {
      finish(new Error("구글 시트 응답 시간이 초과되었습니다."));
    }, 20000);

    function finish(error, data) {
      if (finished) return;

      finished = true;
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();

      if (error) reject(error);
      else resolve(data);
    }

    window[callbackName] = function(response) {

      if (response.status === "error") {
        finish(
          new Error(
            response.errors?.[0]?.detailed_message ||
            response.errors?.[0]?.message ||
            "시트 데이터를 읽지 못했습니다."
          )
        );
        return;
      }

      finish(null, response.table);
    };

    script.onerror = function() {
      finish(new Error("구글 시트 연결에 실패했습니다."));
    };

    script.src = url;
    document.body.appendChild(script);
  });
}


// ==========================================
// 전체 데이터 불러오기
// ==========================================

async function loadAllData() {
  setStatus("구글 시트 데이터를 불러오고 있습니다.");

  productLoaded = false;
  customerLoaded = false;

  try {

    const [productTable, customerTable] = await Promise.all([
      loadSheet(PRODUCT_GID),
      loadSheet(CUSTOMER_GID)
    ]);

    parseProducts(productTable);
    parseCustomers(customerTable);

    productLoaded = true;
    customerLoaded = true;

    updateStatus();
    searchProducts();

  } catch (error) {
    console.error(error);

    setStatus("데이터 연결 오류: " + error.message, true);
  }
}


// ==========================================
// 상품 데이터 처리
// A 바코드
// B 상품분류
// C 메이커
// D 상품명
// E 규격
// F 소매가
// ==========================================

function parseProducts(table) {
  products = [];

  (table.rows || []).forEach(row => {

    const barcode = getCellValue(row, 0);
    const category = getCellValue(row, 1);
    const maker = getCellValue(row, 2);
    const name = getCellValue(row, 3);
    const spec = getCellValue(row, 4);
    const retailPrice = getCellValue(row, 5);

    if (!name) return;

    products.push({
      barcode: String(barcode ?? "").trim(),
      category: String(category ?? "").trim(),
      maker: String(maker ?? "").trim(),
      name: String(name ?? "").trim(),
      spec: String(spec ?? "").trim(),
      retailPrice: parseNumber(retailPrice)
    });
  });
}


// ==========================================
// 거래처별 단가 데이터 처리
//
// 1행: 메이커별 열 제목
// A열: 거래처명
// B열부터: 메이커별 단가율
//
// headers=1이므로 rows[0]은 A2에 해당
// A2 제외를 위해 rows[1]부터 읽음
// ==========================================

function parseCustomers(table) {
  customers = [];

  const rows = table.rows || [];
  const cols = table.cols || [];

  makerHeaders = cols
    .slice(1)
    .map(col => String(col.label || col.id || "").trim());

  for (let i = 1; i < rows.length; i++) {

    const row = rows[i];

    const customerName = String(
      getCellValue(row, 0) ?? ""
    ).trim();

    if (!customerName) continue;

    const rates = {};

    makerHeaders.forEach((makerName, index) => {

      const makerKey = normalizeText(makerName);

      if (!makerKey) return;

      rates[makerKey] = parseRate(
        getCellValue(row, index + 1)
      );
    });

    customers.push({
      name: customerName,
      rates: rates
    });
  }

  const select = document.getElementById("customerSelect");

  select.innerHTML =
    '<option value="">거래처를 선택하세요</option>';

  customers.forEach((customer, index) => {
    const option = document.createElement("option");

    option.value = String(index);
    option.textContent = customer.name;

    select.appendChild(option);
  });
}


// ==========================================
// 거래처별 단가율 조회
// ==========================================

function getCustomerRate(product, customer) {
  if (!product || !customer) return null;

  const makerKey = normalizeText(product.maker);

  if (!makerKey) return null;

  if (
    Object.prototype.hasOwnProperty.call(
      customer.rates,
      makerKey
    )
  ) {
    return customer.rates[makerKey];
  }

  return null;
}


// ==========================================
// 상품 검색
// 숫자 검색: 바코드 전체 일치
// 문자 검색: 상품명 부분 일치
// 바코드 앞 0은 무시
// ==========================================

function searchProducts() {

  const query = document
    .getElementById("searchInput")
    .value
    .trim();

  const customerIndex =
    document.getElementById("customerSelect").value;

  const tbody = document.getElementById("resultBody");
  const resultCount = document.getElementById("resultCount");

  if (!productLoaded || !customerLoaded) return;

  if (customerIndex === "") {
    tbody.innerHTML =
      '<tr><td colspan="7" class="empty">거래처를 선택해 주세요.</td></tr>';

    resultCount.textContent = "0개";
    return;
  }

  if (!query) {
    tbody.innerHTML =
      '<tr><td colspan="7" class="empty">상품명 또는 바코드를 입력해 주세요.</td></tr>';

    resultCount.textContent = "0개";
    return;
  }

  const customer = customers[Number(customerIndex)];
  const isBarcodeSearch = /^\d+$/.test(query);

  const matchedProducts = products.filter(product => {

    if (isBarcodeSearch) {
      return normalizeBarcode(product.barcode) ===
        normalizeBarcode(query);
    }

    return normalizeText(product.name).includes(
      normalizeText(query)
    );
  });

  resultCount.textContent =
    matchedProducts.length.toLocaleString("ko-KR") + "개";

  if (matchedProducts.length === 0) {
    tbody.innerHTML =
      '<tr><td colspan="7" class="empty">검색 결과가 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = "";

  matchedProducts.forEach(product => {

    const rate = getCustomerRate(product, customer);

    let rateText = "-";
    let appliedPrice = "단가율 확인 필요";

    if (rate !== null && product.retailPrice !== null) {

      rateText =
        (rate * 100).toFixed(2).replace(/\.?0+$/, "") + "%";

      appliedPrice =
        formatNumber(
          Math.floor(product.retailPrice * rate)
        ) + "원";

    } else if (rate === null) {
      rateText = "확인 필요";
    }

    const tr = document.createElement("tr");

    const values = [
      product.category,
      product.name,
      product.barcode,
      product.spec,
      product.retailPrice === null
        ? "-"
        : formatNumber(product.retailPrice) + "원",
      rateText,
      appliedPrice
    ];

    values.forEach((value, index) => {

      const td = document.createElement("td");
      td.textContent = value;

      if (index === 1) td.className = "product-name";
      if (index === 5) td.className = "rate";
      if (index === 6) td.className = "price";

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}


// ==========================================
// 상태 표시
// ==========================================

function setStatus(message, isError = false) {
  const status = document.getElementById("status");

  status.textContent = message;
  status.className = isError ? "status error" : "status";
}

function updateStatus() {
  const time = new Date().toLocaleTimeString("ko-KR", {
    hour: "2-digit",
    minute: "2-digit"
  });

  setStatus(
    "상품 " + products.length.toLocaleString("ko-KR") +
    "개 · 거래처 " + customers.length.toLocaleString("ko-KR") +
    "곳 · 마지막 업데이트 " + time
  );
}


// ==========================================
// 60초마다 자동 새로고침
// ==========================================

setInterval(() => {

  const mainScreen = document.getElementById("mainScreen");

  if (!mainScreen.classList.contains("hidden")) {
    loadAllData();
  }

}, 60000);

</script>

</body>
</html>
