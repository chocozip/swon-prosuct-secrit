<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전직 레벨업 재화 계산기</title><style>
:root{color-scheme:dark;--bg:#10131a;--panel:#1a202b;--line:#303b4b;--text:#f3f5f8;--muted:#aeb8c8;--accent:#f5d90a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:24px}main{max-width:980px;margin:auto}h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px}.intro{color:var(--muted);margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}h2{font-size:18px;margin:0 0 16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input,select{width:100%;background:#0e1218;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px;font-size:16px}.wide{grid-column:1/-1}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.result{background:#0e1218;border:1px solid var(--line);padding:14px;border-radius:10px}.result span{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.result strong{font-size:clamp(18px,3vw,26px);overflow-wrap:anywhere}.highlight{border-color:#817400}.highlight strong{color:var(--accent)}button{border:0;border-radius:9px;background:var(--accent);color:#171717;font-weight:700;padding:12px 18px;font-size:15px;cursor:pointer;margin-top:16px}button.secondary{background:#303b4b;color:var(--text);margin-left:8px}.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:12px}.status{font-size:14px;color:var(--accent);margin-top:10px}@media(max-width:680px){body{padding:14px}.grid,.fields,.results{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main><h1>전직 레벨업 재화 계산기</h1><p class="intro">전직 차수와 레벨 범위, 보유 재화 및 소탕 열쇠를 입력해 필요 재화와 열쇠를 계산합니다.</p><div class="grid"><section class="panel"><h2>레벨 범위 및 보유 재화</h2><div class="fields"><div class="wide"><label for="tier">전직 차수</label><select id="tier"><option value="1">1차 전직 (레벨 1~80)</option><option value="2">2차 전직 (레벨 0~100)</option></select></div><div><label for="currentLevel">현재 전직 레벨</label><input id="currentLevel" type="number" min="1" max="80" value="35"></div><div><label for="targetLevel">목표 전직 레벨</label><input id="targetLevel" type="number" min="1" max="80" value="50"></div><div class="wide"><label for="owned">기존 보유 재화</label><input id="owned" type="number" min="0" value="0"></div></div></section><section class="panel"><h2>소탕 수급 재화</h2><div class="fields"><div><label for="towerReward">시련의 탑 소탕 1회 재화</label><input id="towerReward" type="number" min="0" value="0"></div><div><label for="towerKeys">시련의 탑 보유 열쇠</label><input id="towerKeys" type="number" min="0" value="0"></div><div><label for="dungeonReward">보물던전 1 소탕 1회 재화</label><input id="dungeonReward" type="number" min="0" value="0"></div><div><label for="dungeonKeys">보물던전 1 보유 열쇠</label><input id="dungeonKeys" type="number" min="0" value="0"></div></div></section></div><section class="panel" style="margin-top:16px"><h2>계산 결과</h2><div class="results"><div class="result"><span>현재 수급 가능 총 재화</span><strong id="totalAvailable">0</strong></div><div class="result"><span>목표 레벨까지 필요 재화</span><strong id="required">0</strong></div><div class="result"><span>부족 재화</span><strong id="shortage">0</strong></div><div class="result highlight"><span>추가로 필요한 보물던전 1 열쇠</span><strong id="keysNeeded">0개</strong></div></div><div class="status" id="status"></div><p class="note">필요 재화는 현재 레벨 다음 단계부터 목표 레벨까지 비용을 합산합니다. 추가 열쇠는 보유 재화와 입력한 소탕 열쇠의 수급량을 반영한 부족분을 보물던전 1 소탕 1회 재화로 나누어 올림합니다. 2차 전직은 제공된 비용이 있는 0~100레벨까지만 계산합니다.</p><button onclick="calculate()">계산하기</button><button class="secondary" onclick="resetValues()">초기화</button></section></main><script>
const costs1=[1000,1500,2000,2500,3000,3500,4000,4500,5000,5500,8000,10500,13000,15500,18000,20500,23000,25500,28000,30500,35000,39500,44000,48500,53000,57500,62000,66500,71000,75500,80000,90000,100000,110000,120000,130000,140000,150000,160000,170000,190000,210000,230000,250000,270000,290000,310000,330000,350000,370000,400000,450000,500000,550000,600000,650000,700000,750000,800000,1000000,1250000,1500000,1750000,2000000,2250000,2500000,2750000,3000000,3250000,3500000,4000000,4500000,5000000,5500000,6000000,6500000,7000000,7500000,8000000,8500000];
const costs2=[1000,1500,2000,2500,3000,3500,4000,4500,5000,5500,6000,6500,7000,7500,8000,8500,9000,9500,10000,11000,12000,13000,14000,15000,16000,17000,18000,19000,20000,25000,30000,35000,40000,45000,50000,55000,60000,65000,70000,75000,80000,85000,90000,95000,100000,105000,110000,115000,120000,125000,130000,135000,140000,145000,150000,155000,160000,165000,170000,175000,180000,185000,190000,195000,200000,210000,220000,230000,240000,250000,260000,270000,280000,290000,300000,310000,320000,330000,340000,350000,360000,370000,380000,390000,400000,410000,420000,430000,440000,450000,460000,470000,480000,490000,500000,510000,520000,530000,540000,550000,560000];
const n=id=>Math.max(0,Number(document.getElementById(id).value)||0),fmt=n=>Math.floor(n).toLocaleString('ko-KR');function limits(){return document.getElementById('tier').value==='1'?{min:1,max:80,costs:costs1}:{min:0,max:100,costs:costs2}}function updateLimits(){let {min,max}=limits(),c=document.getElementById('currentLevel'),t=document.getElementById('targetLevel');c.min=t.min=min;c.max=t.max=max;c.value=Math.min(max,Math.max(min,Number(c.value)||min));t.value=Math.min(max,Math.max(Number(c.value),Number(t.value)||Number(c.value)));calculate()}
function calculate(){let {min,max,costs}=limits(),cur=Math.floor(Number(document.getElementById('currentLevel').value)),target=Math.floor(Number(document.getElementById('targetLevel').value)),available=n('owned')+n('towerReward')*n('towerKeys')+n('dungeonReward')*n('dungeonKeys');if(cur<min||cur>max||target<cur||target>max){document.getElementById('status').textContent=`레벨 범위를 확인하세요. 현재 ${min}~${max}, 목표는 현재 레벨 이상이어야 합니다.`;['totalAvailable','required','shortage','keysNeeded'].forEach(id=>document.getElementById(id).textContent='—');return}let need=0;for(let level=cur+1;level<=target;level++){let cost=costs[document.getElementById('tier').value==='1'?level-1:level];if(cost===undefined){document.getElementById('status').textContent='해당 레벨 비용 데이터가 없습니다.';return}need+=cost}let short=Math.max(0,need-available),reward=n('dungeonReward'),keys=short===0?0:(reward>0?Math.ceil(short/reward):null);document.getElementById('totalAvailable').textContent=fmt(available);document.getElementById('required').textContent=fmt(need);document.getElementById('shortage').textContent=fmt(short);document.getElementById('keysNeeded').textContent=keys===null?'소탕 재화 입력 필요':fmt(keys)+'개';document.getElementById('status').textContent=short===0?'현재 수급 가능 재화로 목표 레벨까지 올릴 수 있습니다.':'현재 재화 기준으로 부족분을 추가 수급해야 합니다.'}
function resetValues(){document.getElementById('tier').value='1';document.getElementById('currentLevel').value=1;document.getElementById('targetLevel').value=1;['owned','towerReward','towerKeys','dungeonReward','dungeonKeys'].forEach(id=>document.getElementById(id).value=0);updateLimits()}document.getElementById('tier').addEventListener('change',updateLimits);document.querySelectorAll('input').forEach(el=>el.addEventListener('input',calculate));calculate();
</script></body></html>
